# The app and the API share one origin: the session cookie and the SSE stream need no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Server-sent events: no buffering and a long read timeout, or nginx would hold and cut the stream.
    location = /api/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/painel, /restaurantes/...) all load the same page.
    location / {
        try_files $uri /index.html;
    }
}
