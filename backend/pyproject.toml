[project]
name = "taste-match-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "confluent-kafka==2.15.1",
  "fastapi==0.142.2",
  "sqlalchemy==2.1.2",
  "uvicorn==0.54.0",
]

[project.scripts]
taste-match-api = "tastematch_api.main:run"

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
