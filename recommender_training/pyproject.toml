[project]
name = "taste-match-training"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "confluent-kafka==2.6.1",
  "mlflow==2.22.2",
  "numpy==1.26.4",
  "pyyaml==6.0.2",
  "recbole==1.2.1",
  "scipy<1.14",
  "torch==2.2.2",
  "vaderSentiment==3.3.2",
]

[project.scripts]
taste-match-training = "orchestration.cli:main"

[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
